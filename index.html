<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=504, initial-scale=1.0">
    <title>Cuenta Atrás Granada 2026</title>
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800;900&display=swap" rel="stylesheet">
    <!-- Estilos del Widget 504x336 -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor Principal de dimensiones exactas: 504x336 px -->
    <main class="countdown-widget mode-quadrants" id="widget-root" style="width: 504px; height: 336px; overflow: hidden;">
        <div class="quadrants-grid" id="layout-container" aria-live="polite">
            <div class="glass-pane pane-tl">
                <img id="widget-logo" src="https://narrativas.ideal.es/taigranada26/E-sCCHXJ_400x400.jpg" alt="Logo Granada 2026" class="widget-logo">
                <h1 id="text-line1" class="line-quedan">Quedan</h1>
            </div>
            <div class="glass-pane pane-tr">
                <div class="pane-row-inline">
                    
                    <div class="time-unit-group" id="block-days">
                        
                        <div class="number-container" id="days-container">
                            <span class="hidden-placeholder" id="days-placeholder">00</span>
                            <div class="number-slide" id="days-current">00</div>
                        </div>
                        <span class="unit-label" id="label-days">días,</span>
                    </div>
                    
                    <div class="time-unit-group" id="block-hours">
                        
                        <div class="number-container" id="hours-container">
                            <span class="hidden-placeholder" id="hours-placeholder">00</span>
                            <div class="number-slide" id="hours-current">00</div>
                        </div>
                        <span class="unit-label" id="label-hours">horas,</span>
                    </div>
                </div>
                <div class="pane-row-inline" style="margin-top:4px;">
                    
                    <div class="time-unit-group" id="block-minutes">
                        
                        <div class="number-container" id="minutes-container">
                            <span class="hidden-placeholder" id="minutes-placeholder">00</span>
                            <div class="number-slide" id="minutes-current">00</div>
                        </div>
                        <span class="unit-label" id="label-minutes">minutos</span>
                    </div>
                </div>
            </div>
            <div class="glass-pane pane-bl">
                
                    <div class="time-unit-group" id="block-seconds">
                        <span class="unit-label">y</span>
                        <div class="number-container" id="seconds-container">
                            <span class="hidden-placeholder" id="seconds-placeholder">00</span>
                            <div class="number-slide" id="seconds-current">00</div>
                        </div>
                        <span class="unit-label" id="label-seconds">segundos</span>
                    </div>
            </div>
            <div class="glass-pane pane-br">
                <p id="text-line4" class="line-subtitle">para saber si Granada será</p>
                <p id="text-line5" class="line-highlight">Capital Europea de la Cultura</p>
            </div>
        </div>
    </main>

    <!-- Lógica del Contador Regresivo -->
    <script src="script.js"></script>
</body>
</html>
